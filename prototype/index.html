<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品工作台</title><link rel="stylesheet" href="workbench.css"></head><body>
<header class="appbar"><strong><b>◈</b> 产品创建工作台</strong><div><button data-config="model">◇　模型：Codex ⌄</button><button data-config="login">登录</button><button data-config="key">⚿　自定义 API Key</button><button data-config="settings" aria-label="设置">⚙</button></div></header>
<div class="shell"><nav id="globalNav" aria-label="主导航"></nav><main><section id="landing"><div class="center"><h1 id="greeting">Hi，今天有什么安排？</h1><div id="modes" aria-label="选择助手"></div><p id="guide">从一句想法开始。助手会追问需求，你确认 PRD 后，就能生成技术方案。</p><div id="messages" aria-live="polite"></div><div id="intakeActions" aria-live="polite"></div><form id="composer"><div class="box"><textarea id="message" required aria-label="消息" placeholder="输入产品想法、整理需求，或讨论下一步制作计划…"></textarea><div class="controls"><label class="attach" title="导入文本材料">＋<input id="file" type="file" accept=".txt,.md,text/plain,text/markdown" aria-label="导入文本材料"></label><select id="composerModel" aria-label="切换对话模型"><option value="codex">Codex</option></select><button class="send" aria-label="发送">↑</button></div></div><label class="context">▱　项目 <select id="context"></select></label></form><div id="suggest"><small>试试这些指令</small></div></div></section>
<section id="workspace" hidden><div class="stagebar"><strong id="title"></strong><div id="rail" aria-label="项目阶段"></div></div>
<div class="desk"><section class="catalog"><button id="libraryToggle">项目目录 ▾</button><div id="catalogBody"><h3>项目<button id="add" aria-label="新建项目">＋</button></h3><div id="projectList"></div><h3>文档大纲</h3><div id="outline"></div></div></section>
<section class="paper"><div id="tabstrip" aria-label="项目文档标签"></div><div id="summary"></div><section id="exportGuide" aria-label="文档导出引导" hidden></section><progress id="progress" hidden></progress><article id="panel"></article><details><summary>项目记录</summary><ol id="history"></ol></details></section>
<section class="agent"><h2>方案助手</h2><div id="agentMessages" role="log" aria-label="与方案助手的对话" aria-live="polite"></div><form id="agentForm"><textarea aria-label="向项目助手提问" id="agentInput" placeholder="讨论当前项目的需求或方案…" required></textarea><button class="primary" id="ask">发送</button></form></section></div></section>
<section id="emptyProjects" hidden><h2>还没有项目</h2><button id="emptyAdd">＋ 新建项目</button></section><section id="chatShelf"><button id="newChat">＋ 新会话</button><div id="chatList"></div></section>
<section id="documents" hidden><h1>项目文档</h1><p class="library-note">选择项目，查看并下载已确认的文档。</p><div class="library-row library-head" aria-hidden="true"><span>项目名称</span><span>可下载文档</span><span>操作</span></div><div id="docList"></div></section>
<p id="notice" role="status"></p></main></div>
<dialog id="dialog"><form id="form"><h2>新建项目</h2><label for="name">项目名称</label><input id="name" required maxlength="60"><div class="actions"><button class="primary">创建项目</button><button type="button" id="cancel">取消</button></div></form></dialog>
<dialog id="downloads" aria-labelledby="downloadTitle"><div class="download-heading"><div><h2 id="downloadTitle"></h2><p id="downloadCount"></p></div><button id="closeDownloads" aria-label="关闭下载窗口" autofocus>×</button></div><div id="downloadRows"></div><div class="download-footer"><button id="visitProject">打开项目</button><button id="downloadBundle" class="primary">下载汇总文档</button></div></dialog>
<dialog id="deleteProject"><h2>删除项目</h2><p></p><div class="actions"><button id="cancelDelete">取消</button><button id="applyDelete">删除项目</button></div></dialog><dialog id="config"><h2></h2><p></p><button id="closeConfig">关闭</button></dialog><script src="project.js"></script><script src="tasks.js"></script><script src="workbench.js"></script></body></html>
